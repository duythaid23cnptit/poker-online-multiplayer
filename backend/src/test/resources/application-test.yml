spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:cG9rZXItb25saW5lLXRlc3Qtc2lnbmluZy1rZXktZm9yLW9ubHktdGVzdHM=}
      access-token-expiration: 5m
      refresh-token-expiration: 1h
