debug: false

spring:
  application:
    name: poker-online-backend
  profiles:
    default: bootstrap
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:30d}

poker:
  game:
    turn-timeout: ${POKER_GAME_TURN_TIMEOUT:30s}
    timer-update-cadence: ${POKER_GAME_TIMER_UPDATE_CADENCE:1s}

---
spring:
  config:
    activate:
      on-profile: bootstrap
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
